<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .animate-pulse-slow {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100">
    <noscript>
        <h2>Sorry! Your browser doesn't support Javascript</h2>
    </noscript>

    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-20 left-20 w-32 h-32 bg-blue-200 rounded-full opacity-50 animate-float"></div>
        <div class="absolute bottom-20 right-20 w-40 h-40 bg-purple-200 rounded-full opacity-50 animate-float" style="animation-delay: -2s"></div>
        <div class="absolute top-1/2 left-1/3 w-24 h-24 bg-indigo-200 rounded-full opacity-50 animate-float" style="animation-delay: -4s"></div>
    </div>

    <div class="flex h-screen overflow-hidden">
        <div class="w-1/4 bg-white/90 backdrop-blur-sm border-r border-gray-300">
            <header class="p-4 border-b border-gray-300 flex justify-between items-center bg-gradient-to-r from-blue-600 to-purple-600 text-white">
                <h2 class="text-2xl font-semibold">My chats</h2>
                <div class="flex items-center gap-2">
                    <a th:href="@{/createChat}" class="p-2 hover:bg-white/20 rounded-full transition duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                        </svg>
                    </a>
                </div>
            </header>
            
            <div class="overflow-y-auto h-full">
                <div th:each="room : ${userChatRooms}" 
                     th:onclick="'window.location.href=\'/chatroom/chatroom/' + ${room.id} + '\''"
                     class="flex items-center mb-4 cursor-pointer hover:bg-white/50 p-2 rounded-md transition duration-200"
                     th:classappend="${room.id == chatRoomId} ? 'bg-white/50' : ''">
                    <div class="w-12 h-12 bg-gray-300 rounded-full mr-3">
                        <img th:src="@{'https://placehold.co/200x/ffa8e4/ffffff.svg?text=' + ${room.name[0]} + '&font=Lato'}" 
                             th:alt="${room.name}" class="w-12 h-12 rounded-full">
                    </div>
                    <div class="flex-1">
                        <h2 class="text-lg font-semibold" th:text="${room.name}">Chat Name</h2>
                        <p class="text-gray-600" th:text="${room.latestMessage != null ? room.latestMessage.content : 'No messages yet'}">Latest message</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="flex-1 flex flex-col bg-white/80 backdrop-blur-sm">
            <header class="bg-white/90 backdrop-blur-sm p-4 text-gray-700 border-b">
                <h1 class="text-2xl font-semibold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent" th:text="${chatRoomName}"></h1>
            </header>
            
            <div id="messageArea" class="flex-1 overflow-y-auto p-4 pb-4 space-y-4">
                <div th:each="message : ${messages}">
                    <div th:if="${message.username == username}" class="flex justify-end mb-4">
                        <div class="flex max-w-96 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg p-3 gap-3">
                            <p th:text="${message.content}"></p>
                        </div>
                        <div class="w-9 h-9 rounded-full flex items-center justify-center ml-2">
                            <img th:src="@{'https://placehold.co/200x/b7a8ff/ffffff.svg?text=' + ${message.username[0]} + '&font=Lato'}" 
                                 th:alt="${message.username}" class="w-8 h-8 rounded-full">
                        </div>
                    </div>
                    <div th:unless="${message.username == username}" class="flex mb-4">
                        <div class="w-9 h-9 rounded-full flex items-center justify-center mr-2">
                            <img th:src="@{'https://placehold.co/200x/ffa8e4/ffffff.svg?text=' + ${message.username[0]} + '&font=Lato'}" 
                                 th:alt="${message.username}" class="w-8 h-8 rounded-full">
                        </div>
                        <div class="flex max-w-96 bg-white/90 backdrop-blur-sm rounded-lg p-3 gap-3">
                            <p class="text-gray-700" th:text="${message.content}"></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <footer class="bg-white/90 backdrop-blur-sm border-t border-gray-300 p-4">
                <form id="messageForm" class="flex items-center">
                    <input 
                        type="text" 
                        id="message" 
                        placeholder="Type a message..." 
                        autocomplete="off" 
                        class="w-full p-2 rounded-md border border-gray-400 focus:outline-none focus:border-purple-500 bg-white/80 backdrop-blur-sm"
                    />
                    <button 
                        type="submit" 
                        class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 rounded-md ml-2 hover:from-blue-700 hover:to-purple-700 transform hover:scale-105 transition duration-200 ease-in-out"
                    >
                        Send
                    </button>
                </form>
            </footer>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script>
        // Injected variables
        const chatRoomId = [[${chatRoomId}]];
        const username = "[[${username}]]";

        'use strict';

        var messageForm = document.querySelector('#messageForm');
        var messageInput = document.querySelector('#message');
        var messageArea = document.querySelector('#messageArea');

        var stompClient = null;

        var colors = [
            '#2196F3', '#32c787', '#00BCD4', '#ff5652',
            '#ffc107', '#ff85af', '#FF9800', '#39bbb0'
        ];

        function connect(event) {
            if(username) {
                var socket = new SockJS('/chatroom/ws');
                stompClient = Stomp.over(socket);

                stompClient.connect({}, onConnected, onError);
            }
        }

        function onConnected() {
            // Subscribe to the Public Topic
            stompClient.subscribe("/topic/chatroom/"+chatRoomId, onMessageReceived);
            console.log("==> Subscribed to /topic/chatroom/" + chatRoomId);

            // Tell your username to the server
            stompClient.send("/app/chatroom/"+chatRoomId+"/addUser",
                {},
                JSON.stringify({sender: username, type: 'JOIN'})
            )

        }

        function onError(error) {
            // Create and show error popup
            const errorPopup = document.createElement('div');
            errorPopup.classList.add('fixed', 'top-4', 'right-4', 'bg-red-500', 'text-white', 'p-4', 'rounded-lg', 'shadow-lg', 'z-50');
            errorPopup.innerHTML = `
                <div class="flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Connection error. Please try again later.</span>
                </div>
            `;
            document.body.appendChild(errorPopup);

            // Remove popup after 5 seconds
            setTimeout(() => {
                errorPopup.remove();
            }, 5000);

            console.error('WebSocket connection error:', error);
        }

        function sendMessage(event) {
            var messageContent = messageInput.value.trim();
            if(messageContent && stompClient) {
                var chatMessage = {
                    chatRoomId: chatRoomId,
                    sender: username,
                    content: messageInput.value,
                    type: 'CHAT'
                };
                stompClient.send("/app/chatroom/"+chatRoomId+"/sendMessage", {}, JSON.stringify(chatMessage));
                messageInput.value = '';
            }
            event.preventDefault();
        }

        function onMessageReceived(payload) {
            var message = JSON.parse(payload.body);
            console.log(payload);
            var messageContainer = document.createElement('div');

            if(message.type === 'CHAT') {
                // Determine if message is from current user or others
                if (message.sender === username) {
                    // Outgoing message
                    messageContainer.classList.add('flex', 'justify-end', 'mb-4');
                    messageContainer.innerHTML = `
                        <div class="flex max-w-96 bg-indigo-500 text-white rounded-lg p-3 gap-3">
                            <p>${message.content}</p>
                        </div>
                        <div class="w-9 h-9 rounded-full flex items-center justify-center ml-2">
                            <img src="https://placehold.co/200x/b7a8ff/ffffff.svg?text=${username[0]}&font=Lato" alt="My Avatar" class="w-8 h-8 rounded-full">
                        </div>
                    `;
                } else {
                    // Incoming message
                    messageContainer.classList.add('flex', 'mb-4');
                    messageContainer.innerHTML = `
                        <div class="w-9 h-9 rounded-full flex items-center justify-center mr-2">
                            <img src="https://placehold.co/200x/ffa8e4/ffffff.svg?text=${message.sender[0]}&font=Lato" alt="User Avatar" class="w-8 h-8 rounded-full">
                        </div>
                        <div class="flex max-w-96 bg-white rounded-lg p-3 gap-3">
                            <p class="text-gray-700">${message.content}</p>
                        </div>
                    `;
                }
            }

            messageArea.appendChild(messageContainer);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        // Start WebSocket connection
        connect();

        // Send a message
        messageForm.addEventListener('submit', sendMessage, true);
    </script>
</body>
</html>
