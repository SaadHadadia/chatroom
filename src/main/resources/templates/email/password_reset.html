<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333333;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #e1e1e1;
            border-radius: 10px;
        }
        .header {
            font-size: 24px;
            color: #0056b3;
        }
        .content {
            font-size: 16px;
            margin-top: 20px;
        }
        .footer {
            font-size: 12px;
            color: #888888;
            margin-top: 30px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            color: #ffffff;
            background-color: #0056b3;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Password Reset Request</div>
        <div class="content">
            <p>Hello {{name}},</p>
            <p>It seems like you requested a password reset. Please click the button below to reset your password.</p>
            <a href="{{resetLink}}" class="btn">Reset Password</a>
        </div>
        <div class="footer">
            <p>If you did not request this, please ignore this email.</p>
        </div>
    </div>
</body>
</html>
