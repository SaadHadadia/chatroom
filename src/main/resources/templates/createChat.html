<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .animate-pulse-slow {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100 min-h-screen">
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-20 left-20 w-32 h-32 bg-blue-200 rounded-full opacity-50 animate-float"></div>
        <div class="absolute bottom-20 right-20 w-40 h-40 bg-purple-200 rounded-full opacity-50 animate-float" style="animation-delay: -2s"></div>
        <div class="absolute top-1/2 left-1/3 w-24 h-24 bg-indigo-200 rounded-full opacity-50 animate-float" style="animation-delay: -4s"></div>
    </div>

    <div class="flex h-screen items-center justify-center">
        <div class="bg-white/90 backdrop-blur-sm p-8 rounded-xl shadow-lg w-96 animate-pulse-slow">
            <h1 class="text-3xl font-bold text-center bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent mb-6">Create New Chat</h1>
            
            <form th:action="@{/createChat}" method="post" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Chat Name</label>
                    <input type="text" 
                           id="name" 
                           name="name" 
                           required 
                           class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-indigo-500"
                           placeholder="Enter chat name">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Add Users</label>
                    <div class="max-h-60 overflow-y-auto space-y-2 border border-gray-300 rounded-md p-3">
                        <div th:each="user : ${availableUsers}" 
                             class="flex items-center">
                            <input type="checkbox"
                                   th:id="${'user-' + user.id}"
                                   name="userIds"
                                   th:value="${user.id}"
                                   class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                            <label th:for="${'user-' + user.id}"
                                   class="ml-2 block text-sm text-gray-900"
                                   th:text="${user.firstname + ' ' + user.lastname + ' (' + user.email + ')'}">
                            </label>
                        </div>
                    </div>
                </div>
                
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 rounded-lg hover:from-blue-700 hover:to-purple-700 transform hover:scale-105 transition duration-200 ease-in-out">
                    Create Chat
                </button>
            </form>
        </div>
    </div>
</body>
</html>
