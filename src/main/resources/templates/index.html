<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .animate-pulse-slow {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100 min-h-screen flex items-center justify-center overflow-hidden">
    <!-- Animated background bubbles -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-20 left-20 w-32 h-32 bg-blue-200 rounded-full opacity-50 animate-float"></div>
        <div class="absolute bottom-20 right-20 w-40 h-40 bg-purple-200 rounded-full opacity-50 animate-float" style="animation-delay: -2s"></div>
        <div class="absolute top-1/2 left-1/3 w-24 h-24 bg-indigo-200 rounded-full opacity-50 animate-float" style="animation-delay: -4s"></div>
    </div>

    <div class="container mx-auto px-4 relative">
        <div class="max-w-2xl mx-auto bg-white/90 backdrop-blur-sm rounded-xl shadow-lg p-8 animate-pulse-slow">
            <div class="relative">
                <!-- Chat icon -->
                <svg class="w-20 h-20 mx-auto mb-6 text-indigo-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd" />
                </svg>

                <h1 class="text-5xl font-bold text-center bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent mb-8">
                    Welcome to Chat App
                </h1>
            </div>
            <p class="text-gray-600 text-center text-lg mb-8">
                Connect and chat with your friends and colleagues in real-time
            </p>
            <div class="text-center">
                <a th:href="@{/chatroom/1}" 
                   class="inline-block px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold rounded-lg shadow-md hover:from-blue-700 hover:to-purple-700 transform hover:scale-105 transition duration-200 ease-in-out cursor-pointer">
                    Start Chatting
                    <svg class="w-5 h-5 inline-block ml-2 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
