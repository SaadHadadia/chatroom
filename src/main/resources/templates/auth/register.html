<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .animate-pulse-slow {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100">
    <!-- Add animated background bubbles -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-20 left-20 w-32 h-32 bg-blue-200 rounded-full opacity-50 animate-float"></div>
        <div class="absolute bottom-20 right-20 w-40 h-40 bg-purple-200 rounded-full opacity-50 animate-float" style="animation-delay: -2s"></div>
        <div class="absolute top-1/2 left-1/3 w-24 h-24 bg-indigo-200 rounded-full opacity-50 animate-float" style="animation-delay: -4s"></div>
    </div>

    <section class="min-h-screen">
        <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto min-h-screen">
            <div class="w-full bg-white/90 backdrop-blur-sm rounded-lg shadow md:mt-0 sm:max-w-xl xl:p-0 animate-pulse-slow">
                <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
                    <h1 class="text-xl font-bold leading-tight tracking-tight text-center bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent md:text-2xl">
                        Create an account
                    </h1>
                    <form id="registrationForm" class="space-y-4 md:space-y-6" th:action="@{/register}" th:object="${user}" method="post">
                        <div class="flex space-x-4">
                            <div class="w-1/2">
                                <label for="firstname" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">First Name</label>
                                <input type="text" name="firstname" id="firstname" class="bg-white/50 border border-gray-300 text-gray-900 rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Saad" th:field="*{firstname}" required>
                            </div>
                            <div class="w-1/2">
                                <label for="lastname" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Last Name</label>
                                <input type="text" name="lastname" id="lastname" class="bg-white/50 border border-gray-300 text-gray-900 rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Hadadia" th:field="*{lastname}" required>
                            </div>
                        </div>

                        <div>
                            <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Username</label>
                            <input type="email" name="email" id="email" class="bg-white/50 border border-gray-300 text-gray-900 rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="name@company.com" th:field="*{email}" required>
                        </div>

                        <div class="flex space-x-4">
                            <div class="w-1/2">
                                <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password</label>
                                <input type="password" name="password" id="password" placeholder="••••••••" class="bg-white/50 border border-gray-300 text-gray-900 rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" th:field="*{password}" required>
                                <p id="passwordStrength" class="text-sm mt-1"></p>
                            </div>
                            <div class="w-1/2">
                                <label for="confirmPassword" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Confirm Password</label>
                                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="••••••••" class="bg-white/50 border border-gray-300 text-gray-900 rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" required>
                                <p id="passwordMatch" class="text-sm mt-1"></p>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Sign in</button>
                        <p class="text-sm font-light text-gray-500 dark:text-gray-400">
                            Already have an account? <a th:href="@{/login}" class="font-medium text-blue-600 hover:underline dark:text-blue-500">Log in</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordStrengthElement = document.getElementById('passwordStrength');
            const passwordMatchElement = document.getElementById('passwordMatch');
            const submitBtn = document.getElementById('submitBtn');

            // Password strength checker
            function checkPasswordStrength(password) {
                // Criteria for password strength
                const lengthCriteria = password.length >= 8;
                const uppercaseCriteria = /[A-Z]/.test(password);
                const lowercaseCriteria = /[a-z]/.test(password);
                const numberCriteria = /[0-9]/.test(password);
                const specialCharCriteria = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);

                let strength = 0;
                let strengthText = '';
                let strengthColor = '';

                if (lengthCriteria) strength++;
                if (uppercaseCriteria) strength++;
                if (lowercaseCriteria) strength++;
                if (numberCriteria) strength++;
                if (specialCharCriteria) strength++;

                switch(strength) {
                    case 0:
                    case 1:
                        strengthText = 'Very Weak';
                        strengthColor = 'text-red-500';
                        break;
                    case 2:
                        strengthText = 'Weak';
                        strengthColor = 'text-orange-500';
                        break;
                    case 3:
                        strengthText = 'Moderate';
                        strengthColor = 'text-yellow-500';
                        break;
                    case 4:
                        strengthText = 'Strong';
                        strengthColor = 'text-green-500';
                        break;
                    case 5:
                        strengthText = 'Very Strong';
                        strengthColor = 'text-green-700';
                        break;
                }

                passwordStrengthElement.textContent = strengthText;
                passwordStrengthElement.className = `text-sm mt-1 ${strengthColor}`;

                return strength;
            }

            // Password match checker
            function checkPasswordMatch() {
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (password !== confirmPassword) {
                    passwordMatchElement.textContent = 'Passwords do not match';
                    passwordMatchElement.className = 'text-sm mt-1 text-red-500';
                    return false;
                } else if (confirmPassword) {
                    passwordMatchElement.textContent = 'Passwords match';
                    passwordMatchElement.className = 'text-sm mt-1 text-green-500';
                    return true;
                }
                return false;
            }

            // Real-time validation
            passwordInput.addEventListener('input', function() {
                checkPasswordStrength(this.value);
                checkPasswordMatch();
            });

            confirmPasswordInput.addEventListener('input', function() {
                checkPasswordMatch();
            });

            // Form submission prevention
            submitBtn.addEventListener('click', function(event) {
                const passwordStrength = checkPasswordStrength(passwordInput.value);
                const passwordsMatch = checkPasswordMatch();

                if (passwordStrength < 3 || !passwordsMatch) {
                    event.preventDefault();
                    alert('Please ensure your password is strong and passwords match.');
                }
            });
        });
    </script>
</body>
</html>
