<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .animate-pulse-slow {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100">
    <!-- Add animated background bubbles -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-20 left-20 w-32 h-32 bg-blue-200 rounded-full opacity-50 animate-float"></div>
        <div class="absolute bottom-20 right-20 w-40 h-40 bg-purple-200 rounded-full opacity-50 animate-float" style="animation-delay: -2s"></div>
        <div class="absolute top-1/2 left-1/3 w-24 h-24 bg-indigo-200 rounded-full opacity-50 animate-float" style="animation-delay: -4s"></div>
    </div>

    <section class="min-h-screen">
        <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto min-h-screen">
            <div class="w-full bg-white/90 backdrop-blur-sm rounded-lg shadow md:mt-0 sm:max-w-md xl:p-0 animate-pulse-slow">
                <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
                    <h1 class="text-xl font-bold leading-tight tracking-tight text-center bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent md:text-2xl">
                        Sign in to your account
                    </h1>
                    <form class="space-y-4 md:space-y-6" th:action="@{/login}" method="post">
                        <div>
                            <label for="username" class="block mb-2 text-sm font-medium text-gray-900">Your Username</label>
                            <input type="username" name="username" id="username" class="bg-white/50 border border-gray-300 text-gray-900 rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5" placeholder="name@company.com" required="">
                        </div>
                        <div>
                            <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Password</label>
                            <input type="password" name="password" id="password" placeholder="••••••••" class="bg-white/50 border border-gray-300 text-gray-900 rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5" required="">
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2.5 rounded-lg hover:from-blue-700 hover:to-purple-700 transform hover:scale-105 transition duration-200 ease-in-out">Sign in</button>
                        <p class="text-sm font-light text-gray-500">
                            Don't have an account yet? <a th:href="@{/register}" class="font-medium text-transparent bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text hover:underline">Sign up</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
