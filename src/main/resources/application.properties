spring.application.name=chatroom

#Port and Path configuration
server.port=8080
server.servlet.context-path=/chatroom
#Link to the App : http://localhost:8080/chatroom

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/chatroom
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable debugging
logging.level.org.springframework.boot.autoconfigure=DEBUG

# Spring Security Login Credentials
spring.security.user.name=User
spring.security.user.password=123456789
